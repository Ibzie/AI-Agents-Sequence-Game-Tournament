[project]
name = "ai-agents-sequence-game-tournament"
version = "0.1.0"
description = "A benchmark test for agents in a versus manner for the board game Sequence"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.30",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
